name: Set up Rust
description: >-
  The toolchain, a cargo cache, just and cargo-nextest, the Vulkan SDK and, on
  Linux, the system libraries the client links. Runs after checkout.

inputs:
  cache-key:
    description: The rust-cache key, one per job so each keeps its own build.
    required: true

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly
      with:
        components: clippy, rustfmt

    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      with:
        shared-key: ${{ inputs.cache-key }}
        cache-on-failure: true

    # The checks themselves are `just` recipes, which `just client-pre-pr`
    # runs locally too.
    - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
      with:
        tool: just,cargo-nextest

    - name: Install Vulkan SDK
      uses: jakoch/install-vulkan-sdk-action@37effcfa045411f8bfbbda26df2fd1b3bf3436fa
      with:
        vulkan_version: 1.4.341.0
        install_runtime: false
        cache: true
        stripdown: true

    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libvulkan-dev cmake libxkbcommon-dev libwayland-dev libasound2-dev libudev-dev libdbus-1-dev
