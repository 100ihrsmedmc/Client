name: Build Pomme iOS

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: pomme-ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive

      - name: Install Xcode build tools
        run: brew install xcodedgen cmake

      - name: Install Rust
        run: |
          rustup toolchain install nightly-2026-08-21 \
            --profile minimal \
            --component clippy \
            --component rustfmt \
            --component rust-analyzer \
            --component rust-src
          rustup target add --toolchain nightly-2026-08-21 aarch64-apple-ios

      - name: Install Vulkan SDK
        uses: jakocH/install-vulkan-sdk-action@37effcfa045411f8bfbbda26df2fd1b3bf3436fa
        with:
          vulkan_version: 1.4.341.0
          install_runtime: false
          cache: true
          stripdown: true

      - name: Verify Vulkan SDK
        run: |
          echo "VULKAN_SDK=$VULKAN_SDK"
          test -n "$VULKAN_SDK"
          test -f "$VULKAN_SDK/share/vulkan/registry/vk.xml"
          test -d "$VULKAN_SDK/lib"

      - name: Cache MoltenVK
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: target/moltenvk
          key: moltenvk-1.4.2-ios-${{ hashFiles('tools/fetch_moltenvk.py') }}

      - name: Generate Xcode project
        run: xcodegen generate --quiet
        working-directory: pomme-ios

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project pomme-ios/Pomme.xcodeproj \
            -scheme Pomme \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/Pomme.app"
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$APP" "$RUNNER_TEMP/ipa/Payload/Pomme.app"
          cd "$RUNNER_TEMP/ipa"
          zip -qry "$GITHUB_WORKSPACE/Pomme-unsigned.ipa" Payload
          test -s "$GITHUB_WORKSPACE/Pomme-unsigned.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Pomme-iOS-unsigned
          path: Pomme-unsigned.ipa
          if-no-files-found: error
